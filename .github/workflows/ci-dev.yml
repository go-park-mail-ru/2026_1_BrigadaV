name: CI — dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend-lint-test:
    name: Backend lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guidely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.2.0

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/guidely_test?sslmode=disable
        run: go test ./... -v -count=1
