name: CI/CD — main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guidely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/guidely_test?sslmode=disable
        run: go test ./... -v -count=1

  frontend-lint-build:
    name: Frontend lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            REPO_DIR="$HOME/backend"
            FRONTEND_DIR="$HOME/frontend"

            echo "==> Pulling latest code"
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ -d "$FRONTEND_DIR" ]; then
              cd "$FRONTEND_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            cd "$REPO_DIR"

            echo "==> Rebuilding and restarting containers"
            docker compose pull --ignore-pull-failures || true
            docker compose up -d --build --remove-orphans

            echo "==> Waiting for backend health"
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/csrf-token > /dev/null 2>&1; then
                echo "Backend is healthy"
                break
              fi
              echo "Attempt $i/30..."
              sleep 5
            done

            echo "==> Cleaning up unused images"
            docker image prune -f

            echo "==> Deploy complete"
